<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="lcGradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="docGradient" x1="14" y1="6" x2="34" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <filter id="shadow" x="0" y="2" width="48" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Envelope Body with Gradient -->
  <g filter="url(#shadow)">
    <!-- Base Envelope Box -->
    <rect x="6" y="14" width="36" height="26" rx="6" fill="url(#lcGradient)" />
  </g>

  <!-- Emerging Document (LC Contract) -->
  <g>
    <!-- Paper Sheet -->
    <rect x="13" y="6" width="22" height="20" rx="3" fill="url(#docGradient)" stroke="#DBEAFE" stroke-width="1.2" />
    <!-- Document Lines -->
    <line x1="17" y1="11" x2="25" y2="11" stroke="#3B82F6" stroke-width="1.8" stroke-linecap="round" />
    <line x1="17" y1="15" x2="31" y2="15" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
    <line x1="17" y1="19" x2="28" y2="19" stroke="#93C5FD" stroke-width="1.5" stroke-linecap="round" />
    <!-- Green Audit Checkmark on LC Paper -->
    <circle cx="28" cy="11" r="3.2" fill="#10B981" />
    <path d="M26.8 11L27.7 11.9L29.3 10.2" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Envelope Flap Details -->
  <!-- Back lower triangular fold -->
  <path d="M6 38L21 26C22.8 24.6 25.2 24.6 27 26L42 38" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.8" stroke-linecap="round" />
  <!-- Front Bottom Flap -->
  <path d="M6 16L21.8 27.6C23.1 28.5 24.9 28.5 26.2 27.6L42 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
